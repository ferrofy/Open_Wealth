<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Wealth</title>
    <link rel="shortcut icon" href="Images/FavIcon.png" type="image/x-icon">
    <link rel="stylesheet" href="CSS/Style.css">
    <link rel="stylesheet" href="CSS/Responsiveness.css">
</head>

<body>
    <header>
        <h1>Open Wealth</h1>
    </header>
    <main>

        <div class="Chart_Box">
            <h1>Assets Chart</h1>
            <div class="Chart_Box_Ele">
                <div class="Empty_Space"></div>
                <div class="Chart">
                    <div class="Assets_Bar">
                        <div class="Assets_Inner">
                            <div id="Assets_Text"></div>
                        </div>
                    </div>
                </div>
                <div class="Asset_List">
                    <ul>
                        <li id="Asset_List_Crypto">
                            <div class="Crypto_Asset_Box"></div> Crypto
                        </li>
                        <li id="Asset_List_Gold">
                            <div class="Gold_Asset_Box"></div> Gold
                        </li>
                        <li id="Asset_List_Silver">
                            <div class="Silver_Asset_Box"></div> Silver
                        </li>
                        <li id="Asset_List_Stocks">
                            <div class="Stocks_Asset_Box"></div> Stocks
                        </li>
                        <li id="Asset_List_FD">
                            <div class="FD_Asset_Box"></div> FD
                        </li>
                        <li id="Assets_Total">Total: Loading....</li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="Balance">

            <div class="Crypto_Balance">
                <div class="Asset_Logo">
                    <img src="Images/Crypto_Image.png" alt="Bitcoin Image">
                </div>
                <div class="Asset_Data">
                    <h1>Crypto</h1>
                    <p id="Crypto"></p>
                </div>
            </div>

            <div class="Gold_Balance">
                <div class="Asset_Logo">
                    <img src="Images/Gold_Image.png" alt="Gold Image">
                </div>
                <div class="Asset_Data">
                    <h1>Gold</h1>
                    <p id="Gold"></p>
                </div>
            </div>

            <div class="Silver_Balance">
                <div class="Asset_Logo">
                    <img src="Images/Silver_Image.png" alt="Silver Image">
                </div>
                <div class="Asset_Data">
                    <h1>Silver</h1>
                    <p id="Silver"></p>
                </div>
            </div>

            <div class="Stocks_Balance">
                <div class="Asset_Logo">
                    <img src="Images/Stocks_Image.png" alt="Stocks Image">
                </div>
                <div class="Asset_Data">
                    <h1>Stocks</h1>
                    <p id="Stocks"></p>
                </div>
            </div>

            <div class="FD_Balance">
                <div class="Asset_Logo">
                    <img src="Images/FD_Image.png" alt="FD Image">
                </div>
                <div class="Asset_Data">
                    <h1>FD</h1>
                    <p id="FD"></p>
                </div>
            </div>

        </div>
    </main>

    <script src="JS/JS.js"></script>
</body>

</html>
